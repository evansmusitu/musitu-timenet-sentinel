name: Genuine OpenTime v2 model decision and training protocol CPU acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sentinel/opentime_decision.py'
      - 'sentinel/opentime_train.py'
      - 'tests/test_opentime_decision.py'
      - 'scripts/opentime_nebius_v2_job.sh'
      - '.github/workflows/opentime-v2-decision.yml'
  push:
    paths:
      - 'sentinel/opentime_decision.py'
      - 'sentinel/opentime_train.py'
      - 'tests/test_opentime_decision.py'
      - 'scripts/opentime_nebius_v2_job.sh'
      - '.github/workflows/opentime-v2-decision.yml'

permissions:
  contents: read

jobs:
  cpu-preflight-only:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify likelihood decision selection and earlier engine-sampling tests
        run: |
          python -m pytest -q \
            tests/test_opentime_decision.py \
            tests/test_opentime_sampling.py \
            tests/test_opentime_v2_sampler.py
      - name: Check immutable source, manual GPU guard and Python/shell syntax
        run: |
          python -m compileall -q sentinel/opentime_decision.py sentinel/opentime_train.py
          bash -n scripts/opentime_nebius_v2_job.sh
          python - <<'PY'
          from pathlib import Path
          runner=Path('scripts/opentime_nebius_v2_job.sh').read_text()
          trainer=Path('sentinel/opentime_train.py').read_text()
          assert '--train-limit 256 --val-limit 64' in runner
          assert '--validation-sampling prevalence_matched' in runner
          assert '--option-likelihood' in runner
          assert 'explicitly-approved-credit-only' in runner
          assert '5e030b001fb8d4be6d10ebb3a8b9bc3e6ef80983' in runner
          assert 'c19db31d2ce6e84a4ce02c9a0fdfe0869c53775f77b04dd4be5c893afd8335e2' in trainer
          assert 'official_test_used_for_threshold_selection' in trainer
          print('PASS: no automatic GPU launch and immutable training/reference source pins')
          PY
      - name: Reproduce real FD001 v2 engine-separated 256/64 preparation
        run: |
          python -m sentinel.opentime_sampling --download \
            --train-limit 256 --val-limit 64 \
            --output artifacts/opentime-v2-new-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/opentime-v2-new-plan.json').read_text())
          assert d['selected']['train_windows']==256
          assert d['selected']['validation_windows']==64
          assert d['selected']['train_unique_engines']==80
          assert d['selected']['validation_unique_engines']==20
          assert d['selected']['train_class_counts']=={'Yes':128,'No':128}
          assert d['selected']['validation_class_counts']=={'Yes':11,'No':53}
          assert d['heldout_evaluation_performed'] is False
          assert d['gpu_or_paid_compute_used'] is False
          print('PASS: real-data natural validation and balanced training, no GPU')
          PY
      - name: Upload preflight model protocol evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-opentime-v2-likelihood-preflight-cpu
          path: artifacts/opentime-v2-new-plan.json
          retention-days: 30
