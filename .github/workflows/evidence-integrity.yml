name: Verify public Sentinel evidence integrity

on:
  push:
    branches:
      - main
      - feat/evidence-integrity-20261122
    paths:
      - '.github/workflows/evidence-integrity.yml'
      - 'docs/evidence/**'
      - 'docs/decision-audit.html'
      - 'docs/decision-audit.template.html'
      - 'docs/robustness-lab.html'
      - 'docs/robustness-lab.template.html'
      - 'scripts/render_decision_audit.py'
      - 'scripts/render_robustness_lab.py'
      - 'tests/test_decision_audit_render.py'
      - 'tests/test_robustness_lab.py'
  pull_request:
    paths:
      - '.github/workflows/evidence-integrity.yml'
      - 'docs/evidence/**'
      - 'docs/decision-audit.html'
      - 'docs/decision-audit.template.html'
      - 'docs/robustness-lab.html'
      - 'docs/robustness-lab.template.html'
      - 'scripts/render_decision_audit.py'
      - 'scripts/render_robustness_lab.py'
      - 'tests/test_decision_audit_render.py'
      - 'tests/test_robustness_lab.py'

permissions:
  contents: read

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only static-test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Validate schema, model identity, official test populations and reproducible rendering
        run: python -m pytest -q tests/test_decision_audit_render.py tests/test_robustness_lab.py
      - name: Rebuild 100-engine decisions from committed aggregate-only evidence
        run: python -m scripts.render_decision_audit
      - name: Rebuild four-cohort robustness page and aggregate audit
        run: |
          python -m scripts.render_robustness_lab \
            --baseline docs/evidence/frozen_classical_cross_cohort.json \
            --compact docs/evidence/frozen_compact_cross_cohort.json \
            --multidomain docs/evidence/multidomain_fd004_exploratory.json \
            --classifier docs/evidence/multidomain_fd004_classifier.json
      - name: Reject any chart or consolidated JSON that differs from its evidence source
        run: |
          git diff --exit-code -- \
            docs/decision-audit.html \
            docs/robustness-lab.html \
            docs/evidence/cross_cohort_robustness_audit.json
      - name: Compile deterministic audit renderers
        run: python -m compileall -q scripts/render_decision_audit.py scripts/render_robustness_lab.py
