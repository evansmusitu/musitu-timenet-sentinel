name: Frozen 100-engine longitudinal maintenance replay (CPU)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sentinel/longitudinal_replay.py'
      - 'tests/test_longitudinal_replay.py'
      - '.github/workflows/longitudinal-replay.yml'
  push:
    paths:
      - 'sentinel/longitudinal_replay.py'
      - 'tests/test_longitudinal_replay.py'
      - '.github/workflows/longitudinal-replay.yml'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic longitudinal and existing frozen tests
        run: python -m pytest -q tests/test_longitudinal_replay.py tests/test_sequence_integrity.py
      - name: Fetch immutable original compact-model evidence (no training)
        uses: actions/download-artifact@v4
        with:
          name: sentinel-temporal-qa-model-and-results
          run-id: 44819987425
          github-token: ${{ github.token }}
          path: artifacts/frozen_compact
      - name: Reproduce original 100 endpoints then replay every observed engine history
        run: |
          python -m sentinel.longitudinal_replay --download --stride 5 \
            --artifact-dir artifacts/frozen_compact \
            --output-dir artifacts/longitudinal
      - name: Upload aggregate result and full recorded predictions (not raw NASA telemetry)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-longitudinal-replay
          path: |
            artifacts/longitudinal/longitudinal_replay.json
            artifacts/longitudinal/longitudinal_replay_full.csv
          retention-days: 30
