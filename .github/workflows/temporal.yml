name: Train prompt-limited temporal QA Transformer
on:
  workflow_dispatch:
  push:
    paths:
      - 'sentinel/temporal_qa.py'
      - '.github/workflows/temporal.yml'
jobs:
  train-temporal-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: python -m pytest -q
      - name: Train on unseen-engine holdout with NASA FD001
        run: python -m sentinel.temporal_qa --download --epochs 12
      - name: Publish model and evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-temporal-qa-model-and-results
          path: artifacts/temporal_qa_*
          retention-days: 30
