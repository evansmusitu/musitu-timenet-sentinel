name: Recover completed OpenTime 5B Nebius job logs (no compute)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nebius-opentime-log-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-nebius-opentime-log-recovery
  cancel-in-progress: false

jobs:
  recover-logs:
    if: github.repository == 'evansmusitu/musitu-timenet-sentinel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SA_ID: ${{ secrets.NEBIUS_SERVICE_ACCOUNT_ID }}
      KEY_ID: ${{ secrets.NEBIUS_PUBLIC_KEY_ID }}
      PRIVATE_PEM: ${{ secrets.NEBIUS_PRIVATE_KEY }}
      JOB_ID: aijob-e07ag71cvmbtjv2s7w
    steps:
      - uses: actions/checkout@v4
      - name: Recover final job logs and inspect evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          mkdir -p artifacts/nebius-opentime
          [[ "$SA_ID" == "serviceaccount-e04afk1xvsf8pwvd58" ]] || exit 3
          [[ "$JOB_ID" == "aijob-e07ag71cvmbtjv2s7w" ]] || exit 3
          [[ -n "$KEY_ID" && -n "$PRIVATE_PEM" ]] || exit 3
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$PRIVATE_PEM" > "$tmp/private.pem"
          openssl pkey -in "$tmp/private.pem" -noout 2>/dev/null
          curl --fail --silent --show-error --location \
            https://storage.eu-north1.nebius.cloud/cli/install.sh -o "$tmp/install.sh"
          bash "$tmp/install.sh" >/dev/null
          if ! command -v nebius >/dev/null 2>&1; then
            cli="$(find "$HOME" -maxdepth 5 -type f -name nebius -perm -u+x -print -quit 2>/dev/null)"
            [[ -n "$cli" ]] || exit 5
            export PATH="$(dirname "$cli"):$PATH"
          fi
          nebius profile create --endpoint api.nebius.cloud \
            --service-account-id "$SA_ID" --public-key-id "$KEY_ID" \
            --private-key-file "$tmp/private.pem" --profile musitu-recover \
            --parent-id project-e04p7wefbc00y3c7de0pcn >/dev/null
          nebius ai job get --id "$JOB_ID" --profile musitu-recover --format json > "$tmp/job.json"
          python - "$tmp/job.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          m=data.get("metadata") or {}
          status=data.get("status") or {}
          assert m.get("id")=="aijob-e07ag71cvmbtjv2s7w"
          assert m.get("name")=="musitu-opentime-fd001-pilot-20261122"
          print("Verified exact Nebius job:",m["name"])
          print("Final state:",status.get("state","UNKNOWN"))
          print("Started:",status.get("started_at","unknown"),"Finished:",status.get("finished_at","unknown"))
          PY
          cp "$tmp/job.json" artifacts/nebius-opentime/job-state.json
          nebius ai job logs "$JOB_ID" --tail 1000 --since 3h \
            --profile musitu-recover > artifacts/nebius-opentime/job.log
          echo "Recovered Nebius job log successfully."
          python - <<'PY'
          import json,pathlib
          raw=pathlib.Path("artifacts/nebius-opentime/job.log").read_text(encoding="utf-8",errors="replace")
          checkpoints=("MUSITU_OPENTIME_JOB_START","TORCH_VERSION","CUDA_DEVICE",
                       "MODEL_REVISION=","MUSITU_OPENTIME_METRICS_BEGIN",
                       "MUSITU_OPENTIME_METRICS_END","MUSITU_OPENTIME_JOB_SUCCESS")
          for name in checkpoints:
              print("Checkpoint",name,":",name in raw)
          for line in raw.splitlines():
              if any(token in line for token in ("TORCH_VERSION","CUDA_DEVICE","MODEL_REVISION=","MUSITU_OPENTIME_JOB_SUCCESS")):
                  print("Evidence line:",line[-280:])
          start=raw.find("MUSITU_OPENTIME_METRICS_BEGIN")
          end=raw.find("MUSITU_OPENTIME_METRICS_END",start+1) if start>=0 else -1
          if start>=0 and end>start:
              candidate=raw[start+len("MUSITU_OPENTIME_METRICS_BEGIN"):end].strip()
              try:
                  result=json.loads(candidate)
              except json.JSONDecodeError:
                  print("Metrics JSON not directly parseable; full raw log retained.")
              else:
                  pathlib.Path("artifacts/nebius-opentime/metrics.json").write_text(json.dumps(result,indent=2)+"\n")
                  print("Recovered metrics: model =",result.get("checkpoint"))
                  print("Results before =",result.get("before"))
                  print("Results after =",result.get("after"))
          PY

      - name: Retain recovered logs even when parsing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-opentime-5b-gpu-recovered-logs
          path: artifacts/nebius-opentime/
          if-no-files-found: warn
          retention-days: 60
