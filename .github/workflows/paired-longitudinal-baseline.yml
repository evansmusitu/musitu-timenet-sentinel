name: Paired frozen compact versus classical longitudinal evaluation (CPU)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sentinel/replay_baseline_compare.py'
      - 'tests/test_replay_baseline_compare.py'
      - 'tests/test_paired_replay_evidence.py'
      - '.github/workflows/paired-longitudinal-baseline.yml'
  push:
    paths:
      - 'sentinel/replay_baseline_compare.py'
      - 'tests/test_replay_baseline_compare.py'
      - 'tests/test_paired_replay_evidence.py'
      - '.github/workflows/paired-longitudinal-baseline.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare-frozen-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies only
        run: python -m pip install -r requirements.txt pytest
      - name: Synthetic contracts
        run: python -m pytest -q tests/test_replay_baseline_compare.py tests/test_paired_replay_evidence.py
      - name: Fetch original official 100-engine gradient-boosted baseline
        uses: actions/download-artifact@v4
        with:
          name: nasa-cmapss-results
          run-id: 44819062482
          github-token: ${{ github.token }}
          path: artifacts/frozen_replay
      - name: Fetch independently verified frozen compact-model history replay
        uses: actions/download-artifact@v4
        with:
          name: sentinel-longitudinal-replay
          run-id: 45037996122
          github-token: ${{ github.token }}
          path: artifacts/frozen_replay
      - name: Verify original baseline endpoints, then compare exact same windows
        run: |
          python -m sentinel.replay_baseline_compare --download \
            --artifact-dir artifacts/frozen_replay \
            --output-dir artifacts/paired_replay
      - name: Assert committed public evidence matches genuine replay output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          computed=json.loads(Path('artifacts/paired_replay/paired_replay_comparison.json').read_text())
          published=json.loads(Path('docs/evidence/paired_replay_comparison.json').read_text())
          if computed != published:
              raise SystemExit('BLOCKED: public comparison does not match actual frozen-model calculation')
          print('VERIFIED: published model comparison equals freshly reproduced evaluation')
          PY
      - name: Archive verified aggregate only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-paired-longitudinal-comparison
          path: artifacts/paired_replay/paired_replay_comparison.json
          retention-days: 30
