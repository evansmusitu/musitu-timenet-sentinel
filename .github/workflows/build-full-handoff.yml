name: Build complete MUSITU Sentinel chat-transfer ZIP

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-full-handoff.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: github.repository == 'evansmusitu/musitu-timenet-sentinel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble exact tracked source, PR connector, verified GPU evidence and continuation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export LC_ALL=C
          mkdir -p TRANSFER/SOURCE TRANSFER/HANDOFF TRANSFER/EVIDENCE/GPU TRANSFER/TIMENET_CONNECTOR_PR
          # git archive copies the complete, exact tracked repository snapshot
          # without Git history, GitHub Actions secrets, local keys or caches.
          git archive --format=tar HEAD | tar -xf - -C TRANSFER/SOURCE
          git rev-parse HEAD > TRANSFER/SNAPSHOT_COMMIT.txt
          cp TRANSFER/SOURCE/handoff/CONTINUATION_2026-11-22.md TRANSFER/HANDOFF/CONTINUATION.md

          # Preserve connector files from the separate fork at its pinned PR head.
          CONNECTOR_SHA="5be978d4a91f2c18c6ddcaea4af0d6680bc68bcf"
          echo "$CONNECTOR_SHA" > TRANSFER/TIMENET_CONNECTOR_PR/PINNED_PR_HEAD_SHA.txt
          CONNECTOR_DIR="packages/timenet-connectors/src/timenet_connectors/datasets/musitu/cmapss_fd001"
          for name in __init__.py connector.py dataset.yaml; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/evansmusitu/TimeNet/$CONNECTOR_SHA/$CONNECTOR_DIR/$name" \
              -o "TRANSFER/TIMENET_CONNECTOR_PR/$name"
          done

          # Exact artifact generated by the completed serverless 5B GPU pilot
          # includes original logs and independently recovered metrics.
          if gh run download 44984604004 \
             --repo evansmusitu/musitu-timenet-sentinel \
             --name musitu-opentime-5b-gpu-recovered-logs \
             --dir TRANSFER/EVIDENCE/GPU; then
            echo "Original GPU evidence artifact downloaded and bundled."
          else
            echo "WARNING: GPU log artifact could not be downloaded; use original GitHub run 44984604004." \
               > TRANSFER/EVIDENCE/GPU/ARTIFACT_UNAVAILABLE.txt
          fi
          cat > TRANSFER/HANDOFF/README_FIRST.txt <<'TXT'
          MUSITU AXIOM Sentinel — Complete project snapshot for new chat
          ===============================================================
          1. Read HANDOFF/CONTINUATION.md FIRST.
          2. Read SNAPSHOT_COMMIT.txt to identify the exact primary GitHub commit.
          3. SOURCE/ contains ALL tracked files from the pinned primary repository.
          4. TIMENET_CONNECTOR_PR/ contains the 3 contribution files from the
             separate TimeNet fork at pinned PR head revision.
          5. EVIDENCE/GPU/ contains recovered GPU logs/metrics when available.
          6. Follow the exact new-chat command at bottom of CONTINUATION.md.
          7. No API tokens, service-account keys, model weights or raw NASA
             dataset archives are included. Existing encrypted Github Secrets
             remain on GitHub and are not readable from an archive.
          8. This ZIP preserves a snapshot, not future live cloud state.
          Main source: https://github.com/evansmusitu/musitu-timenet-sentinel
          Official TimeNet PR: https://github.com/OpenTSLM/TimeNet/pull/836
          Deadline: 2026-11-22 23:59 PST / 2026-11-23 09:59 Africa/Harare.
          TXT

          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, datetime
          root=pathlib.Path("TRANSFER")
          primary=root/"SOURCE"
          tracked=subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          tracked=[p for p in tracked if p]
          actual_files={str(p.relative_to(primary)) for p in primary.rglob("*") if p.is_file()}
          missing=sorted(set(tracked)-actual_files)
          extra=sorted(actual_files-set(tracked))
          if missing or extra:
              raise SystemExit(f"Tracked source mismatch; missing={missing}, extra={extra}")
          if not (primary/"docs"/"evidence"/"opentime-nov26-fd001-gpu-pilot-metrics.json").is_file():
              raise SystemExit("Critical GPU evidence missing")
          if not (root/"TIMENET_CONNECTOR_PR"/"connector.py").stat().st_size:
              raise SystemExit("TimeNet contribution missing")
          # Fail closed for leaked credentials in this public source artifact.
          for p in root.rglob("*"):
              if not p.is_file(): continue
              if p.suffix.lower() in {".pem",".key",".p12",".pfx"}:
                  raise SystemExit(f"Refusing to package key file: {p}")
              if p.name in {".env","credentials.json","service-account.json"}:
                  raise SystemExit(f"Refusing to package credential file: {p}")
              data=p.read_bytes()
              if b"-----BEGIN PRIVATE KEY-----" in data or b"-----BEGIN RSA PRIVATE KEY-----" in data:
                  raise SystemExit(f"Refusing to package private key in file: {p}")
          version=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          files={}
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name not in {"MANIFEST.json","CHECKSUMS_SHA256.txt"}:
                  files[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
              "project":"MUSITU AXIOM Sentinel — TimeNet/OpenTime Hackathon",
              "created_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "canonical_repository":"evansmusitu/musitu-timenet-sentinel",
              "source_commit":version,
              "tracked_source_file_count":len(tracked),
              "source_complete":True,
              "timenet_connector_pr_url":"https://github.com/OpenTSLM/TimeNet/pull/836",
              "timenet_connector_head_commit":"5be978d4a91f2c18c6ddcaea4af0d6680bc68bcf",
              "gpu_job_id":"aijob-e07ag71cvmbtjv2s7w",
              "gpu_evidence_run":44984604004,
              "gpu_metrics_file":"SOURCE/docs/evidence/opentime-nov26-fd001-gpu-pilot-metrics.json",
              "contains_secrets":False,
              "no_raw_nasa_data":True,
              "no_model_weights":True,
              "snapshot_not_live_state":True,
              "files_sha256":files,
          }
          (root/"MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          (root/"CHECKSUMS_SHA256.txt").write_text("".join(
              f"{digest}  {name}\n" for name,digest in sorted(files.items())
          ),encoding="utf-8")
          print(f"Verified {len(tracked)} tracked source files; {len(files)} packaged files.")
          print("Pinned source revision:", version)
          print("No private key materials included.")
          PY
          (cd TRANSFER && zip -qr /tmp/musitu-transfer-test.zip .)
          unzip -t /tmp/musitu-transfer-test.zip | tail -n 1
          du -h /tmp/musitu-transfer-test.zip

      - name: Upload full verified project handoff archive
        uses: actions/upload-artifact@v4
        with:
          name: MUSITU_AXIOM_TimeNet_Sentinel_FULL_HANDOFF_2026-11-22
          path: TRANSFER/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
