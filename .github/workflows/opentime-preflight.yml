name: OpenTime v2 engine-diverse training preflight (no GPU)
on:
  workflow_dispatch:
  push:
    paths:
      - 'sentinel/opentime_sampling.py'
      - 'sentinel/opentime_train.py'
      - 'tests/test_opentime_sampling.py'
      - '.github/workflows/opentime-preflight.yml'
  pull_request:
    paths:
      - 'sentinel/opentime_sampling.py'
      - 'sentinel/opentime_train.py'
      - 'tests/test_opentime_sampling.py'
      - '.github/workflows/opentime-preflight.yml'
permissions:
  contents: read
jobs:
  preflight-fd001:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies only
        run: python -m pip install -r requirements.txt pytest
      - name: Verify engine-diverse sampler and actual GPU runner wiring
        run: python -m pytest -q tests/test_opentime_sampling.py
      - name: Build FD001 train/validation-only sampling manifest
        run: python -m sentinel.opentime_sampling --download --train-limit 256 --val-limit 64
      - name: Publish planning-only manifest (not trained model results)
        uses: actions/upload-artifact@v4
        with:
          name: opentime-v2-sampling-preflight
          path: artifacts/opentime_sampling_plan.json
          retention-days: 30
